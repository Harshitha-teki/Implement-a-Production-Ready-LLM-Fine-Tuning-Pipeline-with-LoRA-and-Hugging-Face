name: Validate Submission

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Compile Python files (syntax check)
        run: |
          python -m py_compile scripts/*.py || true

      - name: Run lightweight evaluation
        run: |
          python scripts/evaluate_model.py

      - name: Show evaluation metrics
        run: |
          echo "--- evaluation_metrics.json ---"
          cat results/evaluation_metrics.json || true
